name: Build docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:


defaults:
  run:
    shell: bash


permissions:
  contents: read # to fetch code (actions/checkout)


jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout numpy
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: numpy/numpy
        submodules: true
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Install system dependencies
      run: |
        # doxygen generates the C API XML that breathe consumes
        sudo apt-get update
        sudo apt-get install -y doxygen

    - name: Install and build
      run: |
        pip install --upgrade pip
        pip install --group build --group dev-cli --group openblas64 --group doc
        spin build --with-scipy-openblas=64 -j 2

    - name: build devdocs w/ref warnings
      run: |
        # Don't use -q, show warning summary"
        SPHINXOPTS="-W -n" spin docs
        if [[ $(find doc/build/html -type f | wc -l) -lt 1000 ]]; then
            echo "doc build failed: doc/build/html is empty"
            exit -1
        fi

    - name: build NEPS
      run: |
        cd doc/neps
        SPHINXOPTS="-n" make -e html || echo "ignoring errors for now"

    - name: doctests
      run: |
        spin check-docs -v
        spin check-tutorials -v
        # Currently, this does two checks not done by check-docs:
        #  - validates ReST blocks (via validate_rst_syntax)
        #  - checks that all of a module's `__all__` is reflected in the
        #    module-level docstring autosummary

    - name: Upload static files as artifact
      id: deployment
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: doc/build/html
        include-hidden-files: true


  # Deploy job
  deploy:
    # Add a dependency to the build job
    needs: docs
    # Only deploy from main; PR builds just check that the docs build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
